[workspace]
resolver = "3"
members = ["euphoxide", "euphoxide-client", "euphoxide-command"]

[workspace.package]
version = "0.6.1"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.91"
caseless = "0.2.2"
clap = { version = "4.6.5", default-features = false, features = ["std"] }
cookie = "0.18.1"
futures-util = "0.3.33"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
log = "0.4.33"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-tungstenite = "0.30.0"
unicode-normalization = "0.1.25"
# For examples
anyhow = "1.0.104"
rustls = "0.23.43"
# In this workspace
euphoxide = { path = "./euphoxide" }
euphoxide-client = { path = "./euphoxide-client" }
euphoxide-command = { path = "./euphoxide-command" }

[workspace.lints]
rust.unsafe_code = { level = "forbid", priority = 1 }
# Lint groups
rust.deprecated_safe = "warn"
rust.future_incompatible = "warn"
rust.keyword_idents = "warn"
rust.nonstandard_style = "warn"
rust.refining_impl_trait = "warn"
rust.rust_2018_idioms = "warn"
rust.unknown_or_malformed_diagnostic_attributes = "warn"
rust.unused = "warn"
# Individual lints
rust.redundant_imports = "warn"
rust.redundant_lifetimes = "warn"
rust.single_use_lifetimes = "warn"
rust.unit_bindings = "warn"
rust.unnameable_types = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_qualifications = "warn"
# Clippy
clippy.large_enum_variant = "allow"
clippy.use_self = "warn"
